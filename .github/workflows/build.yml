name: Frontend build
on:
  push:
    branches: [main, vault, 'feature/**']
  pull_request:
    branches: [main, vault]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify React production bundle
        run: npm run build
      - name: Validate Suspense image assets
        run: |
          python -m pip install Pillow
          python scripts/validate_suspense_assets.py
